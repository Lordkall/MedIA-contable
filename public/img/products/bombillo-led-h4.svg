<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="200" height="150" fill="transparent"/>
  
  <g transform="translate(65, 15)" filter="url(#glow)">
    <!-- Base H4 y disipador -->
    <rect x="18" y="70" width="34" height="35" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
    <line x1="22" y1="78" x2="48" y2="78" stroke="#64748b" stroke-width="2"/>
    <line x1="22" y1="86" x2="48" y2="86" stroke="#64748b" stroke-width="2"/>
    <line x1="22" y1="94" x2="48" y2="94" stroke="#64748b" stroke-width="2"/>
    <!-- Torre LED -->
    <rect x="25" y="20" width="20" height="50" rx="3" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="28" y="28" width="14" height="10" rx="2" fill="#facc15"/>
    <rect x="28" y="44" width="14" height="10" rx="2" fill="#facc15"/>
    <!-- Haz de luz -->
    <circle cx="35" cy="15" r="8" fill="#38bdf8" opacity="0.6"/>
    <text x="35" y="120" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#38bdf8" text-anchor="middle">LED H4 6000K</text>
  </g>
</svg>