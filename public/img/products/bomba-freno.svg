<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="200" height="150" fill="transparent"/>
  
  <g transform="translate(50, 20)" filter="url(#glow)">
    <!-- Reservorio de líquido -->
    <rect x="25" y="20" width="30" height="25" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="23" y="15" width="34" height="7" rx="2" fill="#334155"/>
    <circle cx="40" cy="32" r="5" fill="#facc15" opacity="0.8"/>
    <!-- Manilla de freno aluminio -->
    <path d="M 50 35 Q 85 45 95 65" stroke="#cbd5e1" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <text x="50" y="110" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">BOMBA FRENO</text>
  </g>
</svg>