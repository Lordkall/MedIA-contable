<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="200" height="150" fill="transparent"/>
  
  <g transform="translate(50, 15)" filter="url(#glow)">
    <!-- Espejo Izquierdo -->
    <ellipse cx="30" cy="35" rx="18" ry="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <line x1="30" y1="47" x2="42" y2="85" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Espejo Derecho -->
    <ellipse cx="70" cy="35" rx="18" ry="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <line x1="70" y1="47" x2="58" y2="85" stroke="#cbd5e1" stroke-width="3"/>
    <text x="50" y="110" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">ESPEJOS 10mm</text>
  </g>
</svg>