<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="200" height="150" fill="transparent"/>
  
  <g transform="translate(45, 15)" filter="url(#glow)">
    <!-- Corona dentada dorada -->
    <circle cx="55" cy="55" r="42" fill="#1e293b" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="55" cy="55" r="24" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="55" cy="55" r="12" fill="#1e293b"/>
    <!-- Piñón pequeño -->
    <circle cx="95" cy="30" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- Cadena dorada -->
    <path d="M 55 13 L 95 14" stroke="#fbbf24" stroke-width="3.5" stroke-dasharray="4,2"/>
    <path d="M 55 97 L 95 46" stroke="#fbbf24" stroke-width="3.5" stroke-dasharray="4,2"/>
    <text x="55" y="58" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#fef08a" text-anchor="middle">428H</text>
  </g>
</svg>