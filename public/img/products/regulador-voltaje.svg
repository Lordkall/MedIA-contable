<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="200" height="150" fill="transparent"/>
  
  <g transform="translate(55, 20)" filter="url(#glow)">
    <rect x="10" y="20" width="70" height="60" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <!-- Aletas disipadoras -->
    <line x1="20" y1="28" x2="70" y2="28" stroke="#64748b" stroke-width="3"/>
    <line x1="20" y1="40" x2="70" y2="40" stroke="#64748b" stroke-width="3"/>
    <line x1="20" y1="52" x2="70" y2="52" stroke="#64748b" stroke-width="3"/>
    <line x1="20" y1="64" x2="70" y2="64" stroke="#64748b" stroke-width="3"/>
    <!-- Cables -->
    <line x1="22" y1="80" x2="22" y2="105" stroke="#ef4444" stroke-width="3"/>
    <line x1="33" y1="80" x2="33" y2="105" stroke="#22c55e" stroke-width="3"/>
    <line x1="45" y1="80" x2="45" y2="105" stroke="#eab308" stroke-width="3"/>
    <line x1="57" y1="80" x2="57" y2="105" stroke="#eab308" stroke-width="3"/>
    <line x1="68" y1="80" x2="68" y2="105" stroke="#000000" stroke-width="3"/>
    <text x="45" y="120" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">REGULADOR 5C</text>
  </g>
</svg>