<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="panBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="panShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <rect width="200" height="150" fill="transparent"/>
  <!-- Bag of Harina PAN -->
  <g transform="translate(60, 15)" filter="url(#panShadow)">
    <rect x="0" y="5" width="80" height="115" rx="8" fill="url(#panBg)"/>
    <!-- Top fold -->
    <path d="M 0 15 Q 40 5 80 15 L 80 5 L 0 5 Z" fill="#b45309"/>
    <!-- Front Circle -->
    <circle cx="40" cy="55" r="28" fill="#1e3a8a"/>
    <circle cx="40" cy="55" r="25" fill="#fef08a"/>
    <!-- Corn Icon -->
    <path d="M 40 38 Q 48 45 40 70 Q 32 45 40 38 Z" fill="#eab308"/>
    <path d="M 33 58 Q 40 68 47 58" stroke="#15803d" stroke-width="2" fill="none"/>
    <!-- Brand text P.A.N. -->
    <text x="40" y="98" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">P.A.N.</text>
    <text x="40" y="110" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#fef08a" text-anchor="middle">MAÍZ BLANCO</text>
  </g>
</svg>